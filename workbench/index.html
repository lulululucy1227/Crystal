<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crystal Workbench - 水晶设计工作台</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="window-title"><span class="app-mark" aria-hidden="true"></span><strong>Crystal Workbench - 水晶设计工作台</strong><span class="window-actions" aria-label="窗口视觉控件"><i></i><i></i><i></i></span></header>
  <nav class="menu-bar" aria-label="应用菜单"><button>文件(F)</button><button>编辑(E)</button><button>视图(V)</button><button>工具(T)</button><button>窗口(W)</button><button>帮助(H)</button></nav>
  <section class="tool-bar" aria-label="工具栏">
    <button data-tool="new" title="新建设计板"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 13h8M12 9v8"/></svg><span>新建</span></button><button disabled title="打开现有设计板尚未接入"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3zM3 7V5h7l2 2"/></svg><span>打开</span></button><button data-tool="save" title="保存当前设计草稿"><svg viewBox="0 0 24 24"><path d="M4 3h14l2 2v16H4zM7 3v6h9V3M8 18h8v-5H8z"/></svg><span>保存</span></button><button disabled title="导入功能尚未接入"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 18v3h16v-3"/></svg><span>导入</span></button><button data-tool="export" title="导出当前选品 CSV"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4zM8 8l8 8M16 8l-8 8"/></svg><span>导出 Excel</span></button><button data-view="desk" title="进入设计板"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 4v16M4 9h16M11 13h5"/></svg><span>设计板</span></button><button data-view="inspiration" title="进入参考图库"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM7 16l4-4 3 3 2-2 2 3M8 8h.1"/></svg><span>参考图库</span></button><button disabled title="设置尚未接入"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 13v-2l2-1 .7-1.7-.8-2 1.4-1.4 2 .8L11 5h2l1-2.2 2-.8 1.4 1.4-.8 2L18 7l2 1v2l-2 1-.7 1.7.8 2-1.4 1.4-2-.8L13 19h-2l-1 2.2-2 .8-1.4-1.4.8-2L6 16z"/></svg><span>设置</span></button><button disabled title="帮助尚未接入"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5 1-1.5 1.8-1.5 3M12 17h.1"/></svg><span>帮助</span></button>
  </section>
  <div class="desktop-shell"><aside class="left-pane"><div class="panel-title">导航 <button aria-label="关闭导航面板" disabled>×</button></div><nav class="tree-nav" aria-label="工作台导航"><button data-view="home"><span class="tree-icon">▧</span>总览</button><div class="tree-group"><button data-view="catalog"><span class="tree-icon">▤</span>选品清单</button><button class="tree-child" data-view="catalog">全部清单</button><button class="tree-child" disabled>我收藏的</button></div><button data-view="catalog" data-section="minerals_crystals"><span class="tree-icon">◇</span>水晶</button><button data-view="catalog" data-section="hardware_accessories"><span class="tree-icon">◎</span>配饰</button><button data-view="catalog" data-section="packaging"><span class="tree-icon">□</span>包装</button><button data-view="inspiration"><span class="tree-icon">▣</span>参考图库</button><button data-view="desk"><span class="tree-icon">▦</span>设计板</button></nav><section class="today-box"><h2>今日概览</h2><dl id="today-counts"></dl></section></aside><main id="app" class="center-pane" aria-live="polite">加载中…</main><aside class="right-pane" aria-label="精选库"><section class="side-panel"><div class="panel-title">配饰精选 <button aria-label="关闭配饰面板" disabled>×</button></div><div id="accessory-preview" class="side-grid accessory-grid"></div><button class="more-link" data-view="catalog" data-section="hardware_accessories">查看更多配饰…</button></section><section class="side-panel"><div class="panel-title">包装精选 <button aria-label="关闭包装面板" disabled>×</button></div><div id="packaging-preview" class="side-grid packaging-grid"></div><button class="more-link" data-view="catalog" data-section="packaging">查看更多包装…</button></section></aside></div>
  <footer class="status-bar"><span id="status-text">就绪</span><time id="local-clock"></time></footer><script src="app.js"></script>
</body>
</html>
