<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crystal Workbench - 水晶设计工作台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css"></head>
<body>
  <header class="window-title"><span class="app-mark" aria-hidden="true"></span><strong>Crystal Workbench - 水晶设计工作台</strong></header>
  <section class="tool-bar" aria-label="工具栏">
    <button data-tool="new" title="新建设计板"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 13h8M12 9v8"/></svg><span>新建</span></button><button data-tool="export" title="导出当前选品 CSV"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4zM8 8l8 8M16 8l-8 8"/></svg><span>导出选品</span></button><button data-view="desk" title="进入设计板"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 4v16M4 9h16M11 13h5"/></svg><span>设计板</span></button><button data-view="inspiration" title="进入参考图库"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM7 16l4-4 3 3 2-2 2 3M8 8h.1"/></svg><span>参考图库</span></button>
  </section>
  <div class="desktop-shell"><aside class="left-pane"><div class="panel-title">导航</div><nav class="tree-nav" aria-label="工作台导航"><button data-view="home"><span class="tree-icon">▧</span>总览</button><div class="tree-group"><button data-view="catalog"><span class="tree-icon">▤</span>选品清单</button><button class="tree-child" data-view="catalog">全部清单</button></div><button data-view="catalog" data-section="minerals_crystals"><span class="tree-icon">◇</span>水晶</button><button data-view="catalog" data-section="hardware_accessories"><span class="tree-icon">◎</span>配饰</button><button data-view="catalog" data-section="packaging"><span class="tree-icon">□</span>包装</button><button data-view="inspiration"><span class="tree-icon">▣</span>参考图库</button><button data-view="desk"><span class="tree-icon">▦</span>设计板</button></nav><section class="today-box"><h2>今日概览</h2><dl id="today-counts"></dl></section></aside><main id="app" class="center-pane" aria-live="polite">加载中…</main><aside class="right-pane" aria-label="精选库"><section class="side-panel"><div class="panel-title">配饰精选</div><div id="accessory-preview" class="side-grid accessory-grid"></div><button class="more-link" data-view="catalog" data-section="hardware_accessories">查看更多配饰…</button></section><section class="side-panel"><div class="panel-title">包装精选</div><div id="packaging-preview" class="side-grid packaging-grid"></div><button class="more-link" data-view="catalog" data-section="packaging">查看更多包装…</button></section></aside></div>
  <footer class="status-bar"><span id="status-text">就绪</span><time id="local-clock"></time></footer><script type="module" src="app.js?build=circular-studio-v1"></script>
</body>
</html>
